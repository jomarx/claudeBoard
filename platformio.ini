; Claude usage meter - 2.8" ESP32-32E display board (E32R28T / E32N28T), sold by diymore.
; Pinout from https://www.lcdwiki.com/2.8inch_ESP32-32E-7789
;
;   LCD  ST7789P3 240x320, SPI: SCK 14, MOSI 13, MISO 12, CS 15, DC 2, RST = EN, backlight 21 (high = on)
;   Touch XPT2046 on its own SPI bus: SCK 25, MOSI 32, MISO 39, CS 33, IRQ 36
;   RGB LED 22/16/17 (low = on), speaker amp enable 4 (low = on), battery ADC 34, BOOT 0
;
; Envs:
;   e32r28t - resistive touch version (default)
;   e32n28t - no-touch version, BOOT button only
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = e32r28t

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI setup (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    ; The wiki lists ST7789P3 but also ships ILI9341V init code; if the picture is
    ; garbled, try -DILI9341_2_DRIVER=1 instead.
    -DST7789_DRIVER=1
    ; If colours look inverted or red/blue are swapped, flip these two:
    -DTFT_INVERSION_OFF=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    ; big digits (0-9 : - .) for the clock screen
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    ; flashes red, green, blue at boot - remove once the panel is confirmed
    -DBOOT_SELFTEST=1

[env:e32r28t]
build_flags =
    ${env.build_flags}
    -DTOUCH_XPT2046=1
    -DXPT_SCK=25
    -DXPT_MOSI=32
    -DXPT_MISO=39
    -DXPT_CS=33
    -DXPT_IRQ=36
    ; raw 12-bit range of the panel, tune if taps land off-target
    -DTOUCH_X_MIN=230
    -DTOUCH_X_MAX=3770
    -DTOUCH_Y_MIN=260
    -DTOUCH_Y_MAX=3900
    ; calibrated 2026-11-27: raw X is mirrored, Y is not, no axis swap
    -DTOUCH_INVERT_X=1
    ; report every tap's raw and mapped position over serial, for calibration
    -DTOUCH_DEBUG=1

[env:e32n28t]
